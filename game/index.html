<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Origin Engine</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas {
            display: block;
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            print:    function(t) { console.log(t); },
            printErr: function(t) { console.error(t); },
            
            noImageDecoding: true,

            locateFile: function(path, prefix) {
                if (path.endsWith(".data")) {
                    return "https://media.githubusercontent.com/media/aloyak/originWebsite/main/game/game.data";
                }
                return prefix + path;
            },

            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies || 0, left);
                if (left) {
                    var progress = Math.round(100 * (this.totalDependencies - left) / this.totalDependencies);
                    console.log("Loading Assets: " + progress + "%");
                } else {
                    console.log("Download complete. Initializing engine...");
                }
            },

            onRuntimeInitialized: function() {
                var canvas = document.getElementById('canvas');
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
                console.log("Origin Engine Initialized");
            }
        };

        window.onerror = function(event) {
            if (event.includes("out of memory") || event.includes("buffer")) {
                console.error("The 300MB file is too large for the browser's allocated RAM.");
            }
        };
    </script>
    <script async type="text/javascript" src="game.js"></script>
</body>
</html>
