<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Origin Engine</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        
        canvas { display: block; width: 100vw; height: 100vh; }

        /* Simplified Loading Overlay */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="text-align: center;">
            <br><h3>Loading Origin Engine</h3><br>
            <p>Downloading Assets & Loading Scene</p>
            <p>This can take up to a minute</p>

            <br><br>
            <p style="font-size: 0.8em; color: #777777;">(Check Console for Details)</p>
        </div> </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        const loader = document.getElementById('loading-screen');

        var Module = {
            canvas: document.getElementById('canvas'),
            
            locateFile: (path) => {
                return path.endsWith(".data") 
                    ? "https://media.githubusercontent.com/media/aloyak/originWebsite/main/game/game.data" 
                    : path;
            },

            onRuntimeInitialized: function() {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
                
                console.log("Origin Engine Initialized");
            }
        };

        window.onerror = () => {
            loader.innerHTML = "Error: System failure or Out of Memory";
        };
    </script>
    <script async src="game.js"></script>
</body>
</html>
